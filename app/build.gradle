plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.putrajaya.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.putrajaya.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.1'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PUTRAJAYA_KEYSTORE') ?: 'putrajaya-release.jks')
            storePassword System.getenv('PUTRAJAYA_STORE_PASSWORD') ?: 'PutraJayaRelease2026!'
            keyAlias System.getenv('PUTRAJAYA_KEY_ALIAS') ?: 'putrajaya'
            keyPassword System.getenv('PUTRAJAYA_KEY_PASSWORD') ?: 'PutraJayaRelease2026!'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}
