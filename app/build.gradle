plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.putrajaya.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.putrajaya.app.test'
        minSdk 23
        targetSdk 35
        versionCode 100
        versionName 'TEST-1.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PUTRAJAYA_KEYSTORE') ?: 'putrajaya-test-release.jks')
            storePassword System.getenv('PUTRAJAYA_STORE_PASSWORD') ?: 'PutraJayaTest2026!'
            keyAlias System.getenv('PUTRAJAYA_KEY_ALIAS') ?: 'putrajaya-test'
            keyPassword System.getenv('PUTRAJAYA_KEY_PASSWORD') ?: 'PutraJayaTest2026!'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
