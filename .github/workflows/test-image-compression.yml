name: PUTRAJAYA TEST - Image Compression

on:
  push:
    branches:
      - putrajaya-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-image-compression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST branch
        uses: actions/checkout@v4
        with:
          ref: putrajaya-test
          fetch-depth: 0

      - name: Integrate automatic image compression into TEST web app
        shell: python
        run: |
          from pathlib import Path
          import sys

          path = Path('docs/index.html')
          if not path.exists():
              print('docs/index.html tidak ditemukan')
              sys.exit(1)

          text = path.read_text(encoding='utf-8')
          marker = '/* PUTRAJAYA_TEST_IMAGE_COMPRESSION_V1 */'
          if marker in text:
              print('Image compressor sudah terpasang; tidak ada perubahan.')
              sys.exit(0)

          script = r'''<script>
          /* PUTRAJAYA_TEST_IMAGE_COMPRESSION_V1 */
          (() => {
            const MAX_SIDE = 1200;
            const QUALITY = 0.75;
            const TARGET = 'image/webp';

            const makeCompressedFile = (blob, original) => {
              const base = (original.name || 'foto').replace(/\.[^.]+$/, '');
              return new File([blob], base + '.webp', {
                type: blob.type || TARGET,
                lastModified: Date.now()
              });
            };

            function loadImage(file) {
              return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                  URL.revokeObjectURL(url);
                  resolve(img);
                };
                img.onerror = () => {
                  URL.revokeObjectURL(url);
                  reject(new Error('Gagal membaca gambar'));
                };
                img.src = url;
              });
            }

            function blobFromCanvas(canvas) {
              return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                  if (blob) return resolve(blob);
                  canvas.toBlob(jpeg => jpeg ? resolve(jpeg) : reject(new Error('Gagal membuat gambar')), 'image/jpeg', QUALITY);
                }, TARGET, QUALITY);
              });
            }

            async function compressImageFile(file) {
              if (!file || !file.type.startsWith('image/')) return file;
              const img = await loadImage(file);
              const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
              canvas.height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
              const ctx = canvas.getContext('2d', { alpha: true });
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const blob = await blobFromCanvas(canvas);
              return makeCompressedFile(blob, file);
            }

            async function processFileInput(input) {
              if (!input.files || !input.files.length) return false;
              const files = Array.from(input.files);
              const compressed = [];
              let changed = false;
              for (const file of files) {
                const next = await compressImageFile(file);
                compressed.push(next);
                if (next !== file) changed = true;
              }
              if (!changed) return false;
              const dt = new DataTransfer();
              compressed.forEach(file => dt.items.add(file));
              input.files = dt.files;
              input.dataset.pjCompressed = '1';
              return true;
            }

            // Capture phase prevents existing upload handlers from seeing the original
            // camera/gallery file. After compression, the same change event is replayed.
            document.addEventListener('change', async event => {
              const input = event.target;
              if (!(input instanceof HTMLInputElement) || input.type !== 'file') return;
              if (input.dataset.pjReplayed === '1') {
                delete input.dataset.pjReplayed;
                return;
              }
              const imageFiles = Array.from(input.files || []).filter(f => f.type && f.type.startsWith('image/'));
              if (!imageFiles.length) return;

              event.stopImmediatePropagation();
              try {
                input.dataset.pjCompressing = '1';
                const originalBytes = imageFiles.reduce((n, f) => n + f.size, 0);
                await processFileInput(input);
                const resultBytes = Array.from(input.files || []).reduce((n, f) => n + f.size, 0);
                input.dataset.pjReplayed = '1';
                input.dispatchEvent(new Event('change', { bubbles: true }));
                if (typeof window.toast === 'function') {
                  const a = (originalBytes / 1024).toFixed(0);
                  const b = (resultBytes / 1024).toFixed(0);
                  window.toast(`Foto dikompres: ${a} KB → ${b} KB`);
                }
              } catch (err) {
                console.warn('Kompres foto gagal, file asli dipakai:', err);
                input.dataset.pjReplayed = '1';
                input.dispatchEvent(new Event('change', { bubbles: true }));
              } finally {
                delete input.dataset.pjCompressing;
              }
            }, true);
          })();
          </script>'''

          if '</body>' in text:
              text = text.replace('</body>', script + '\n</body>', 1)
          elif '</html>' in text:
              text = text.replace('</html>', script + '\n</html>', 1)
          else:
              text += '\n' + script + '\n'

          path.write_text(text, encoding='utf-8')
          print('Kompres otomatis terintegrasi ke docs/index.html')

      - name: Commit integration if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
          else
            git commit -m "feat(test): compress uploaded images before save"
            git push origin HEAD:putrajaya-test
          fi
