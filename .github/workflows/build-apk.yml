name: Build Putra Jaya TEST APK

on:
  push:
    branches: [ putrajaya-test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create TEST release signing key
        env:
          STORE_PASSWORD: PutraJayaTest2026!
          KEY_PASSWORD: PutraJayaTest2026!
        run: |
          keytool -genkeypair -v \
            -keystore putrajaya-test-release.jks \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias putrajaya-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Putra Jaya TEST, OU=PutraJaya, O=PutraJaya, L=Indonesia, ST=Jawa Barat, C=ID"

      - name: Build signed TEST APK
        env:
          PUTRAJAYA_KEYSTORE: ${{ github.workspace }}/putraja-test-release.jks
          PUTRAJAYA_STORE_PASSWORD: PutraJayaTest2026!
          PUTRAJAYA_KEY_ALIAS: putrajaya-test
          PUTRAJAYA_KEY_PASSWORD: PutraJayaTest2026!
        run: gradle :app:clean :app:assembleRelease --stacktrace

      - name: Verify TEST APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "Size: $SIZE bytes"
          test "$SIZE" -gt 300000
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$SDK_APKSIGNER"
          "$SDK_APKSIGNER" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/PUTRAJAYA-TEST-1.0.apk

      - name: Upload installable TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: PUTRAJAYA-TEST-INSTALLABLE
          path: dist/PUTRAJAYA-TEST-1.0.apk
          if-no-files-found: error
