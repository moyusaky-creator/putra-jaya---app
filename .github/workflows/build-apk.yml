name: Build Putra Jaya APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create release signing key
        env:
          STORE_PASSWORD: PutraJayaRelease2026!
          KEY_PASSWORD: PutraJayaRelease2026!
        run: |
          keytool -genkeypair -v \
            -keystore putrajaya-release.jks \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias putrajaya \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Putra Jaya, OU=PutraJaya, O=PutraJaya, L=Indonesia, ST=Jawa Barat, C=ID"

      - name: Build signed release APK
        env:
          PUTRAJAYA_KEYSTORE: ${{ github.workspace }}/putrajaya-release.jks
          PUTRAJAYA_STORE_PASSWORD: PutraJayaRelease2026!
          PUTRAJAYA_KEY_ALIAS: putrajaya
          PUTRAJAYA_KEY_PASSWORD: PutraJayaRelease2026!
        run: gradle :app:clean :app:assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "Size: $SIZE bytes"
          test "$SIZE" -gt 1000000
          mkdir -p dist
          cp "$APK" dist/PUTRAJAYA-2-2026.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PUTRAJAYA-2-INSTALLABLE
          path: dist/PUTRAJAYA-2-2026.apk
          if-no-files-found: error
