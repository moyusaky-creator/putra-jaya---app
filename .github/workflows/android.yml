name: Build PUTRAJAYA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'PUTRAJAYA_2_ONLINE.html'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      -       - name: Find APK
        run: |
          echo "=== SEMUA FILE APK ==="
          find android -type f -name "*.apk" -exec ls -lh {} \;

      - name: Verify and prepare APK
        run: |
          APK=$(find android -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          SIZE=$(stat -c%s "$APK")
          echo "Ukuran APK: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK terlalu kecil!"
            exit 1
          fi

          cp "$APK" PUTRAJAYA-FINAL.apk

          echo "APK siap di-upload."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUTRAJAYA-APK-FINAL
          path: PUTRAJAYA-FINAL.apk
          if-no-files-found: error
