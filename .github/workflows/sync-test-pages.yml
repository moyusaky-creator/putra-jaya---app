name: Sync PUTRAJAYA TEST Pages

on:
  push:
    branches: [putrajaya-test]
    paths:
      - 'PUTRAJAYA_2_ONLINE.html'
      - '.github/workflows/sync-test-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST branch
        uses: actions/checkout@v4
        with:
          ref: putrajaya-test

      - name: Copy application directly into docs
        run: |
          mkdir -p docs
          cp PUTRAJAYA_2_ONLINE.html docs/index.html
          cp PUTRAJAYA_2_ONLINE.html docs/PUTRAJAYA_TEST.html

      - name: Commit copied TEST web app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/PUTRAJAYA_TEST.html
          git diff --cached --quiet || git commit -m "Copy PUTRAJAYA TEST app directly into Pages docs"
          git push origin putrajaya-test
